# ~/.tmux.conf — Claude Code session board.
#
# Layout: one tmux window per Claude Code session. Every window carries a
# narrow sidebar pane on the left that lists all windows and marks which ones
# want your attention. ~/.claude/hooks/claude-notify.sh sets the window option
# @claude_state (needs-input | done) when it posts a notification, and clears it
# when you reply, so the sidebar and status bar mirror your alerts.
#
# Switch windows with ctrl-b <number>, by clicking a sidebar row, or by
# clicking a name in the status bar.
#   ctrl-b Tab   popup picker
#   ctrl-b b     hide or show the sidebar in this window
#   ctrl-b c     new window          ctrl-b &   close window
#   ctrl-b d     detach (sessions keep running)

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g history-limit 100000
set -g focus-events on
set -g default-terminal "tmux-256color"
set -ga terminal-features ",ghostty:RGB,xterm-256color:RGB"

# The notify hook names each window after its project folder. Keep tmux from
# overwriting that with the running command name.
setw -g automatic-rename off
setw -g allow-rename off

# ---------------------------------------------------------------- sidebar ---
# A pane belongs to exactly one window, so a single sidebar cannot follow you
# across windows. Give every window an identical one instead: same effect.
set-hook -g after-new-window  'split-window -hbd -l 28 -t "{top-left}" "exec $HOME/.local/bin/claude-sidebar"'
set-hook -g after-new-session 'split-window -hbd -l 28 -t "{top-left}" "exec $HOME/.local/bin/claude-sidebar"'

# tmux resizes panes proportionally, so the sidebar stretched with the terminal.
# These pin it back to 28 columns, leaving the Claude pane to absorb the change.
#
# They are plain tmux commands, not run-shell. An external script runs after the
# server has already drawn the new layout, so the sidebar was visibly stretched
# and then snapped back. A command in the hook is queued in the server itself and
# applies before the redraw reaches the terminal.
#
# window-resized is the one that matters: it fires after tmux has resized the
# window to fit the client, which is the moment the sidebar has just been
# stretched. Verified that resize-pane does NOT itself fire window-resized, so
# these cannot retrigger each other.
#
# after-select-window fires BEFORE an off-screen window is resized to fit the
# client, so it cannot be relied on alone; it is here for the case where the
# window was already the right size. The guard keeps resize-pane from erroring on
# a window that has no sidebar.
set-hook -g window-resized         'if -F "#{>:#{window_panes},1}" "resize-pane -t \"{top-left}\" -x 28"'
set-hook -g client-resized         'if -F "#{>:#{window_panes},1}" "resize-pane -t \"{top-left}\" -x 28"'
set-hook -g after-select-window    'if -F "#{>:#{window_panes},1}" "resize-pane -t \"{top-left}\" -x 28"'
set-hook -g session-window-changed 'if -F "#{>:#{window_panes},1}" "resize-pane -t \"{top-left}\" -x 28"'

# Opening an instance clears its macOS alert. after-select-window is the one
# event every way of opening one goes through: a click on a sidebar row,
# option-tab, ctrl-b <number>, the ctrl-b Tab picker, and the jump that clicking
# the alert itself performs. It can only fire from the terminal, so an alert is
# never dropped while you are away in another app. claude-dismiss reads the
# window's @claude_sid (published by the notify hook) to find the alert's group.
#
# Index [1] rather than -a: appending would add a second copy of this hook every
# time the config is sourced, while a numbered slot is simply overwritten. The
# resize hook above holds slot [0].
set-hook -g after-select-window[1] 'run-shell -b "$HOME/.local/bin/claude-dismiss #{window_id}"'

bind b   run-shell '$HOME/.local/bin/claude-sidebar-toggle #{window_id}'

# ------------------------------------------------------- launch and remove ---
# ctrl-b Tab  manager: number jumps, "x <number>" closes, "n" opens the picker
# ctrl-b C    the new-instance screen, in the main pane (same as clicking "+")
# ctrl-b X    close this window (its Claude pane and sidebar together)
bind Tab display-popup -E -w 80% -h 60% '$HOME/.local/bin/claude-switch'
bind C   run-shell '$HOME/.local/bin/claude-new #{session_name}'
bind X   confirm-before -p 'close window #W? (y/n) ' kill-window

# --------------------------------------------------------- option chords ----
# No prefix needed. The left Option key acts as Alt, set in
# ~/.config/ghostty/config.
#   option-tab        / option-shift-tab   move the highlight down / up, then
#                                          switch once you stop pressing
#   option-up         / option-down        move this row up / down the list
#   option-n                               new instance (the picker)
#   option-w                               close this window (not the picker)
bind -n M-Tab  run-shell '$HOME/.local/bin/claude-tab #{session_name} next'
bind -n M-BTab run-shell '$HOME/.local/bin/claude-tab #{session_name} prev'
bind -n M-Up   run-shell '$HOME/.local/bin/claude-move #{session_name} #{window_id} up'
bind -n M-Down run-shell '$HOME/.local/bin/claude-move #{session_name} #{window_id} down'
bind -n M-n    run-shell '$HOME/.local/bin/claude-new #{session_name}'
bind -n M-w    run-shell '$HOME/.local/bin/claude-close #{session_name} #{window_id}'

# ------------------------------------------------------------- status bar ---
# Off. The sidebar already lists every instance and its state, so the bar only
# repeated it. Turning it off gives the row back to the Claude pane. Prompts and
# messages (ctrl-b X's confirmation, for one) still draw on the bottom row when
# they are needed.
set -g status off

set -g pane-border-style 'fg=#262626'
set -g pane-active-border-style 'fg=#3a3a3a'
set -g message-style 'bg=#303030,fg=#ffffff'
set -g display-time 2000
